---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Turn on daily package list update and security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Never reboot the server automatically
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52crm-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Make sure the unattended-upgrades service is enabled and running
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
