name: crm

services:
  mysql:
    image: mysql:8.4
    container_name: crm-mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm}
      MYSQL_USER: ${MYSQL_USER:-crm_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    mem_limit: 192m
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/arpityadavald2/crm-app:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env}
    container_name: crm-app
    restart: unless-stopped
    mem_limit: 200m
    environment: &app_env
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${MYSQL_DATABASE:-crm}
      DB_USER: ${MYSQL_USER:-crm_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      APP_VERSION: ${APP_IMAGE_TAG}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/arpityadavald2/crm-app:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env}
    container_name: crm-worker
    restart: unless-stopped
    mem_limit: 150m
    command: ['node', 'dist/worker.js']
    # the worker has no HTTP port, so the image healthcheck must be off
    healthcheck:
      disable: true
    environment: *app_env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    image: ghcr.io/arpityadavald2/crm-app:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env}-migrate
    profiles: ['tools']
    environment: *app_env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
